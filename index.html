<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/eve-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <!--
      Route-specific title/description/canonical/og/twitter/JSON-LD tags are
      no longer hardcoded here — each public page renders its own via the
      <Seo> component (src/seo/Seo.jsx), and the prerender step bakes the
      result into the static HTML served for that route. This shell's tags
      are only what a not-yet-hydrated or non-public (authenticated) page
      should fall back to. See SEO-SPEC.md §2.
    -->
    <meta name="keywords" content="AI leadership coaching, micro-learning, leadership development, team building, executive coaching, AI coach, Human First AI, Eve" />
    <meta name="author" content="Human First AI" />
    <meta name="theme-color" content="#2D4A47" />

    <!--
      No static <title> here on purpose: react-helmet-async inserts its own
      managed <title> rather than taking over a pre-existing static one, so
      leaving one here produced two <title> tags in the final prerendered
      HTML (invalid, and the static one wins per spec). Authenticated app
      routes (out of scope for this spec — see SEO-SPEC.md §2.1) don't
      render <Seo> and so show a blank tab title until they mount; that's a
      cosmetic gap, not an indexing one, since those routes are noindex.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
